<h1>Contato</h1>

<p>Envie uma mensagem pelo formulário abaixo, ou escreva para <a href="mailto:contato@renaldofreire.dev">contato@renaldofreire.dev</a>.</p>

<form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="cd2eb4c2-8333-44a4-acbf-f8e09873285b">
    <input type="hidden" name="redirect" value="https://renaldofreire.dev/contato/sucesso/">
    <input type="hidden" name="subject" value="Nova mensagem através do portfólio">
    <input type="checkbox" name="botcheck" style="display: none;">

    <label for="name">Nome</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Mensagem</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Enviar</button>
</form>
